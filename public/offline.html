<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오프라인</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FDFAF7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #6E1B32;
      text-align: center;
    }

    .container {
      max-width: 360px;
      padding: 20px;
    }

    .bird {
      width: 160px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 700;
    }

    p {
      font-size: 12px;
      line-height: 1.6;
      color: #8C6F78;
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      padding: 10px 23px;
      border-radius: 28px;
      border: none;
      background: #8E1B3A;
      color: white;
      font-weight: 600;
      text-decoration: none;
      font-size: 16px;
      transition: opacity 0.2s ease;
    }

    .button:active {
      opacity: 0.8;
    }

    .retry {
      width: 16px;
      margin-left: 5px;
      vertical-align: middle;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="404bird.svg" alt="offline bird" class="bird" id="offlineBird" />
    <h1>인터넷 연결이 끊어졌어요</h1>
    <p>
      네트워크 연결을 확인한 후 다시 시도해주세요.<br />
      연결이 복구되면 자동으로 페이지가 정상 작동합니다.
    </p>
    <button class="button" id="retryBtn">
        다시 시도
        <img src="retry.svg" alt="retry" class="retry" id="retryIcon" />
    </button>
  </div>
  <script>
    const retryBtn = document.getElementById('retryBtn');
    const birdImg = document.getElementById('offlineBird');
    const retryIcon = document.getElementById('retryIcon');

    const getReturnUrl = () => {
      const raw = sessionStorage.getItem('lastPathBeforeOffline');
      if (!raw || raw === '/offline.html') return '/';
      return raw;
    };

    birdImg.addEventListener('error', () => {
      birdImg.style.display = 'none';
      const fallback = document.createElement('div');
      fallback.setAttribute('aria-hidden', 'true');
      fallback.style.width = '160px';
      fallback.style.height = '160px';
      fallback.style.margin = '0 auto 24px';
      fallback.style.borderRadius = '50%';
      fallback.style.background = 'rgba(142, 27, 58, 0.08)';
      fallback.style.display = 'flex';
      fallback.style.alignItems = 'center';
      fallback.style.justifyContent = 'center';
      fallback.style.fontSize = '44px';
      fallback.style.color = '#8E1B3A';
      fallback.textContent = '📡';
      birdImg.parentElement.insertBefore(fallback, birdImg.parentElement.firstChild);
    }, { once: true });

    retryIcon.addEventListener('error', () => {
      retryIcon.style.display = 'none';
    }, { once: true });

    retryBtn.addEventListener('click', () => {
      if (!navigator.onLine) {
        alert('아직 인터넷이 연결되지 않았어요. 네트워크를 확인해주세요.');
        return;
      }
      window.location.href = getReturnUrl();
    });

    window.addEventListener('online', () => {
      window.location.href = getReturnUrl();
    });
  </script>
</body>
</html>
